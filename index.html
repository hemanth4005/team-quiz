<!DOCTYPE html>
<html>
<head>
    <title>Team Quiz</title>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        .option {
            display: block;
            margin: 10px;
            padding: 15px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .option:hover {
            background: #d6ebff;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<h1>Monthly Team Quiz</h1>

<h2 id="question"></h2>

<div id="answers"></div>

<h3 id="score"></h3>

<script>

const quiz = [

{
    question: "Which cloud platform provides Azure Virtual Desktop?",
    options: ["AWS","Azure","Google","Oracle"],
    answer: "Azure"
},

{
    question: "Which command lists files in Linux?",
    options: ["pwd","ls","cat","grep"],
    answer: "ls"
},

{
    question: "Which tool is commonly used for ITSM?",
    options: ["Photoshop","ServiceNow","Chrome","Visio"],
    answer: "ServiceNow"
}

];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

    const q = quiz[currentQuestion];

    document.getElementById("question").innerText =
        q.question;

    const answersDiv =
        document.getElementById("answers");

    answersDiv.innerHTML = "";

    q.options.forEach(option => {

        const btn =
            document.createElement("button");

        btn.className = "option";

        btn.innerText = option;

        btn.onclick = () => checkAnswer(option);

        answersDiv.appendChild(btn);

    });
}

function checkAnswer(selected) {

    if(selected === quiz[currentQuestion].answer){
        score++;
    }

    currentQuestion++;

    if(currentQuestion < quiz.length){

        loadQuestion();

    } else {

        document.body.innerHTML =
        `<h1>Quiz Complete!</h1>
         <h2>Your Score: ${score}/${quiz.length}</h2>`;

    }
}

loadQuestion();

</script>

</body>
</html>
