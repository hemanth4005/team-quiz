<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACN-AMA Quiz Host</title><style>:root{--bg:#07111f;--panel:#0f172aee;--text:#f8fafc;--muted:#a8b4c7;--purple:#a855f7;--blue:#2563eb;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--border:#94a3b83b}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,#a855f738,transparent 28%),radial-gradient(circle at 85% 12%,#06b6d42b,transparent 25%),linear-gradient(145deg,#050b14,#0b1424 52%,#07111f);display:grid;place-items:center;padding:20px}.app{width:min(980px,100%)}.card{background:var(--panel);border:1px solid var(--border);border-radius:26px;box-shadow:0 24px 70px #0006;padding:clamp(22px,4vw,42px)}.hidden{display:none!important}h1{font-size:clamp(2.2rem,6vw,4.5rem);line-height:1;margin:10px 0 18px}h2{font-size:clamp(1.45rem,3vw,2.35rem)}p{line-height:1.6}.eyebrow{color:#d8b4fe;text-transform:uppercase;letter-spacing:.15em;font-size:.78rem;font-weight:800}.lead,.muted,.note{color:var(--muted)}.note{font-size:.86rem}.field{margin:20px 0}label{display:block;font-weight:750;margin-bottom:8px}input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--border);background:#020617b3;color:white;outline:0}.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{color:white;background:linear-gradient(135deg,var(--purple),var(--blue))}.secondary{color:#dbeafe;background:#17233a;border:1px solid var(--border)}.danger{color:white;background:#b91c1c}button:disabled{opacity:.45;cursor:not-allowed}.status{padding:12px 14px;border:1px solid var(--border);background:#02061775;border-radius:14px;margin:14px 0}.ok{color:#bbf7d0}.bad{color:#fecaca}.meta{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:20px}.chip{padding:8px 12px;background:#0b1527;border:1px solid var(--border);border-radius:999px;font-weight:750}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{min-height:86px;color:white;text-align:left;background:linear-gradient(145deg,#142039,#101a2e);border:1px solid var(--border);border-radius:17px;padding:17px;display:flex;gap:13px;align-items:center;font-weight:750;cursor:pointer}.option.correct{border-color:var(--green);background:#22c55e26}.option.wrong{border-color:var(--red);background:#ef444426}.letter{flex:0 0 36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#ffffff16}.timer{height:9px;border-radius:99px;background:#0b1527;overflow:hidden;margin:18px 0 24px}.timer>div{height:100%;background:var(--green);transition:width .25s linear}.feedback{padding:13px 15px;border-radius:14px;background:#02061775;margin-top:16px;min-height:50px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.board{margin-top:24px;border:1px solid var(--border);border-radius:17px;overflow:hidden}.board h3{margin:0;padding:14px 17px;background:#111c31}.row{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;padding:11px 17px;border-top:1px solid #94a3b81f}.me{background:#a855f71c}.center{text-align:center}.big{font-size:3rem;font-weight:900}.lobby{display:grid;place-items:center;min-height:240px;text-align:center}.pulse{width:18px;height:18px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 #22c55e80;animation:pulse 1.5s infinite}@keyframes pulse{to{box-shadow:0 0 0 14px #22c55e00}}@media(max-width:650px){.options{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.meta>*:first-child{grid-column:1/-1}.row{grid-template-columns:32px 1fr auto}.correctcol{display:none}.actions{flex-direction:column}.actions button{width:100%}}</style></head><body><main class="app"><section class="card"><p class="eyebrow">Host console</p><h1>ACN-AMA Fun Quiz</h1><div id="status" class="status">Connecting...</div><div id="setup"><div class="field"><label>Game ID</label><input id="game" maxlength="30" placeholder="Example: ama-oct-2026"></div><button id="create" class="primary" disabled>Create Host Room</button></div><div id="controls" class="hidden"><div class="meta"><div id="phase" class="chip">Lobby</div><div id="qcount" class="chip">0/11</div><div id="count" class="chip">0/50 players</div></div><h2 id="question">Lobby open. Ask players to join.</h2><div class="timer" id="timerWrap" style="display:none"><div id="timerBar"></div></div><div id="timerText" class="chip" style="display:none;margin-bottom:12px">30s</div><div id="options" class="options"></div><div class="actions"><button id="push" class="primary">Push First Question</button><button id="reveal" class="secondary" disabled>Reveal Answer</button><button id="boardBtn" class="secondary" disabled>Show Leaderboard</button><button id="finish" class="danger">End Quiz</button></div><p class="note">Keep this host page private. Players should open index.html, not host.html.</p><div class="board"><h3>🏆 Live leaderboard</h3><div id="board"></div></div></div></section></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,doc,setDoc,updateDoc,collection,query,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC0BZBs_86VpcjYEU4_H-yHxbz4zIQz8oc",authDomain:"team-quiz-ed8df.firebaseapp.com",projectId:"team-quiz-ed8df",storageBucket:"team-quiz-ed8df.firebasestorage.app",messagingSenderId:"561841751172",appId:"1:561841751172:web:0c48dbde987600fc7a2ed1"};
const quiz=[
{question:"In Azure, which service is most commonly used by Indian startups to host simple websites without managing servers?",choices:["Azure Virtual Machines","Azure App Service","Azure Kubernetes Service","Azure Bastion"],answer:1,explanation:"Azure App Service is the go-to PaaS choice for most Indian startups and agencies for web apps."},
{question:"How many months have 28 days?",choices:["1","2","11","All 12"],answer:3,explanation:"Classic trick question — every month has at least 28 days."},
{question:"In the movie Sholay, what does Gabbar Singh famously say when he is angry?",choices:["Kitne aadmi the?","Tera kya hoga Kaalia?","Jo dar gaya samjho mar gaya","All of the above"],answer:3,explanation:"All three are iconic Gabbar Singh dialogues from Sholay."},
{question:"In cricket, what does ‘Golden Duck’ mean?",choices:["Getting out on the first ball of the match","Getting out without scoring on the first ball faced","Scoring 0 in both innings","Getting run out without facing a ball"],answer:1,explanation:"A Golden Duck is when a batter is dismissed on the very first ball they face."},
{question:"Which Indian city is famously called the ‘Silicon Valley of India’?",choices:["Hyderabad","Pune","Bengaluru","Chennai"],answer:2,explanation:"Bengaluru (Bangalore) has been known as the Silicon Valley of India for decades."},
{question:"In a T20 cricket match, what is the maximum number of overs one bowler is allowed to bowl?",choices:["2","4","5","10"],answer:1,explanation:"In T20, a bowler can bowl a maximum of 4 overs."},
{question:"In IT Incident Management, what does P1 usually stand for?",choices:["Priority 1 – Critical","Problem 1","Process 1","Pending 1"],answer:0,explanation:"P1 = Priority 1, the highest severity incidents that need immediate attention."},
{question:"Which of these is a real Indian invention / discovery?",choices:["Zero (as a number)","Pizza","Chocolate","WiFi"],answer:0,explanation:"The concept of zero as a number was developed in ancient India (Aryabhata / Brahmagupta era)."},
{question:"What does the Azure service ‘Azure Functions’ allow you to do?",choices:["Run code without managing servers (serverless)","Create virtual machines","Manage DNS","Store large files only"],answer:0,explanation:"Azure Functions is Microsoft’s serverless compute service — very popular for event-driven apps."},
{question:"In current Indian internet slang, what does ‘no cap’ mean?",choices:["No cricket cap","No lie / for real","No money","No problem"],answer:1,explanation:"Just like global Gen-Z, Indian youth also use ‘no cap’ to mean ‘I’m not lying’ or ‘for real’."}
];
const $=id=>document.getElementById(id),TIME=30;let db,user,gameId,state=null,unsubGame,unsubPlayers,timerTick;function clean(v){return v.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-').replace(/-+/g,'-').slice(0,30)}function safe(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function secondsLeft(){if(!state?.startedAt)return TIME;return Math.max(0,TIME-Math.floor((Date.now()-state.startedAt.toMillis())/1000))}function startTimer(){clearInterval(timerTick);$('timerWrap').style.display='block';$('timerText').style.display='inline-block';const draw=()=>{const s=secondsLeft();$('timerBar').style.width=`${s/TIME*100}%`;$('timerBar').style.background=s<=5?'var(--red)':s<=10?'var(--amber)':'var(--green)';$('timerText').textContent=s+'s';if(s<=0)clearInterval(timerTick)};draw();timerTick=setInterval(draw,250)}function stopTimer(){clearInterval(timerTick);$('timerWrap').style.display='none';$('timerText').style.display='none'}
async function connect(){if(Object.values(firebaseConfig).some(v=>v.includes('YOUR_'))){$('status').className='status bad';$('status').textContent='Add your Firebase configuration first.';return}try{const app=initializeApp(firebaseConfig);db=getFirestore(app);user=(await signInAnonymously(getAuth(app))).user;$('status').className='status ok';$('status').textContent='Connected. Create a unique room.';$('create').disabled=false}catch(e){$('status').className='status bad';$('status').textContent=e.message}}
async function create(){gameId=clean($('game').value);if(!gameId)return;try{await setDoc(doc(db,'quizGames',gameId),{hostId:user.uid,status:'lobby',questionIndex:-1,playerCount:0,startedAt:null,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});$('setup').classList.add('hidden');$('controls').classList.remove('hidden');$('status').textContent=`Room created: ${gameId}`;listen()}catch(e){$('status').className='status bad';$('status').textContent=e.message}}
function listen(){unsubGame=onSnapshot(doc(db,'quizGames',gameId),s=>{state=s.data();$('phase').textContent=state.status.toUpperCase();$('qcount').textContent=`${Math.max(0,state.questionIndex+1)}/${quiz.length}`;$('count').textContent=`${state.playerCount||0}/50 players`;renderState()});const q=query(collection(db,'quizGames',gameId,'players'),orderBy('score','desc'),limit(50));unsubPlayers=onSnapshot(q,s=>{$('board').innerHTML=s.docs.map((d,i)=>{const r=d.data();return `<div class="row"><strong>${i+1}</strong><span>${safe(r.name)}</span><strong>${r.score||0} pts</strong><span class="correctcol muted">${r.correct||0}/${quiz.length}</span></div>`}).join('')})}
function renderState(){const i=state.questionIndex;if(i>=0&&i<quiz.length){$('question').textContent=quiz[i].question;$('options').innerHTML=quiz[i].choices.map((c,x)=>`<div class="option ${state.status==='reveal'&&x===quiz[i].answer?'correct':''}"><span class="letter">${'ABCD'[x]}</span><span>${safe(c)}</span></div>`).join('')}else{$('question').textContent='Lobby open. Ask players to join.';$('options').innerHTML=''}if(state.status==='question')startTimer();else stopTimer();$('reveal').disabled=state.status!=='question';$('boardBtn').disabled=state.status!=='reveal';$('push').disabled=state.status==='question'||state.status==='reveal'||state.status==='finished';$('push').textContent=state.questionIndex<0?'Push First Question':state.questionIndex>=quiz.length-1?'Finish Quiz':'Push Next Question'}
async function push(){const next=state.questionIndex+1;if(next>=quiz.length){await end();return}await updateDoc(doc(db,'quizGames',gameId),{status:'question',questionIndex:next,startedAt:serverTimestamp(),updatedAt:serverTimestamp()})}async function reveal(){await updateDoc(doc(db,'quizGames',gameId),{status:'reveal',updatedAt:serverTimestamp()})}async function board(){await updateDoc(doc(db,'quizGames',gameId),{status:'leaderboard',updatedAt:serverTimestamp()})}async function end(){await updateDoc(doc(db,'quizGames',gameId),{status:'finished',updatedAt:serverTimestamp()})}$('create').onclick=create;$('push').onclick=push;$('reveal').onclick=reveal;$('boardBtn').onclick=board;$('finish').onclick=end;connect();</script></body></html>
